[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-manager-compose"
version = "1.1.2"
description = "Odoo Manager Compose: creador + helper + monitor + migración Odoo con docker-compose"
readme = {file = "README.pypi.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "berisoft-arg", email = "ariel.ameghino@gmail.com"}]
maintainers = [{name = "berisoft-arg", email = "ariel.ameghino@gmail.com"}]
keywords = ["odoo", "docker-compose", "oca", "adhoc", "migrar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["flask>=3.0", "gunicorn>=21.2"]
[project.urls]
Homepage = "https://github.com/berisoft-arg/odoo-manager-compose"
Repository = "https://github.com/berisoft-arg/odoo-manager-compose"
Issues = "https://github.com/berisoft-arg/odoo-manager-compose/issues"
Changelog = "https://github.com/berisoft-arg/odoo-manager-compose/blob/master/CHANGELOG.md"

[project.scripts]
omc = "omc.cli:main"
omc-monitor = "omc.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omc = ["templates/*.tpl", "versions/*.env", "data/*.json", "monitor/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
